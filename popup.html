<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 520px;
        height: fit-content;
        background: linear-gradient(135deg, #0f0f14 0%, #1a1a24 100%);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #e4e4e7;
        display: flex !important;
        padding: 0;
        margin: 0;
        overflow: hidden; /* prevent outer scrollbar */
      }
      html { overflow: hidden; }

      .container {
        width: 100%;
        height: auto;
        background: linear-gradient(145deg, #1c1c28 0%, #16161f 100%);
        border-radius: 0;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-start;
        padding: 28px 24px;
        gap: 20px;
        margin: 0;
      }

      .row {
        display: flex;
        gap: 12px;
        width: 100%;
      }

      /* Select wrapper for custom arrow */
      .select-wrapper {
        position: relative;
        flex: 1;
        display: flex;
      }

      .select-wrapper::after {
        content: '\25BE'; /* downward triangle */
        position: absolute;
        top: 50%;
        right: 16px;
        transform: translateY(-50%);
        font-size: 14px;
        color: #9ca3af;
        pointer-events: none;
        transition: color .25s ease;
      }

      .select-wrapper:focus-within::after {
        color: #6366f1;
      }

      select {
        flex: 1;
        padding: 12px 16px;
        border: 1.5px solid #2a2a38;
        border-radius: 10px;
        background: linear-gradient(135deg, #1f1f2e 0%, #18182a 100%);
        color: #e4e4e7;
        font-size: 14px;
        font-weight: 500;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2), inset 0 1px 2px rgba(255, 255, 255, 0.03);
        outline: none;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        -webkit-appearance: none;
        appearance: none;
        background-clip: padding-box;
        padding-right: 44px; /* space for arrow */
      }

      select:hover {
        border-color: #3a3a4a;
        background: linear-gradient(135deg, #232336 0%, #1c1c2e 100%);
      }

      select:focus {
        border-color: #6366f1;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15), 0 2px 8px rgba(0, 0, 0, 0.2);
      }

      /* Option list styling (supported in Chrome for basic colors) */
      select option {
        background-color: #1f1f2e;
        color: #e4e4e7;
      }
      select option:hover {
        background-color: #232336;
      }
      select option:checked, select option:focus {
        background: #4338ca;
        color: #fff;
      }

      button {
        background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
        color: #ffffff;
        font-weight: 600;
        font-size: 14px;
        padding: 12px 24px;
        border: none;
        border-radius: 10px;
        box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3), 0 2px 4px rgba(0, 0, 0, 0.2);
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
      }

      button::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, transparent 100%);
        opacity: 0;
        transition: opacity 0.3s;
      }

      button:hover {
        background: linear-gradient(135deg, #5558e3 0%, #4338ca 100%);
        box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4), 0 2px 6px rgba(0, 0, 0, 0.3);
        transform: translateY(-1px);
      }

      button:hover::before {
        opacity: 1;
      }

      button:active {
        transform: translateY(0);
        box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
      }

      .example-block img {
        max-width: 100%;
        height: auto;
        border-radius: 12px;
        aspect-ratio: 16 / 9;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      }

      .explanation-box {
        display: flex;
        flex-direction: column;
        gap: 0.85rem;
        width: 100%;
        overflow-y: auto; /* only this scrolls */
        max-height: 420px; /* expand until this, then scroll */
        background: linear-gradient(135deg, #1f1f2e 0%, #18182a 100%);
        color: #d4d4d8;
        padding: 20px;
        border-radius: 12px;
        border: 1.5px solid #2a2a38;
        font-family: 'Inter', 'Segoe UI', sans-serif;
        font-size: 14px;
        box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.2), 0 2px 8px rgba(0, 0, 0, 0.15);
        line-height: 1.7;
        scrollbar-width: thin;
        scrollbar-color: #3a3a4a #1f1f2e;
      }

      .explanation-box::-webkit-scrollbar {
        width: 8px;
      }

      .explanation-box::-webkit-scrollbar-track {
        background: #1f1f2e;
        border-radius: 10px;
      }

      .explanation-box::-webkit-scrollbar-thumb {
        background: #3a3a4a;
        border-radius: 10px;
      }

      .explanation-box::-webkit-scrollbar-thumb:hover {
        background: #4a4a5a;
      }

      .explanation-box ul {
        padding-left: 1.5rem;
        list-style-type: disc;
        margin-bottom: 1rem;
      }

      .explanation-box li {
        margin-bottom: 0.75rem;
        color: #d4d4d8;
      }

      .explanation-box p {
        margin: 0.5rem 0;
        color: #d4d4d8;
      }

      .explanation-box strong {
        color: #fafafa;
        font-weight: 600;
      }

      .explanation-box pre {
        background: #0d0d12;
        border: 1px solid #2a2a38;
        border-radius: 8px;
        padding: 14px;
        margin: 0.75rem 0;
        overflow-x: auto;
        box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.3);
      }

      .explanation-box pre code {
        display: block;
        max-width: 100%;
        overflow-x: auto;
        background-color: transparent;
        max-height: 250px;
        color: #86efac;
        padding: 0;
        border-radius: 0;
        font-size: 13px;
        font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
        line-height: 1.6;
      }

      .explanation-box code::-webkit-scrollbar {
        height: 6px;
      }

      .explanation-box code::-webkit-scrollbar-track {
        background: #0d0d12;
      }

      .explanation-box code::-webkit-scrollbar-thumb {
        background: #2a2a38;
        border-radius: 3px;
      }

      .explanation-box code::-webkit-scrollbar-thumb:hover {
        background: #3a3a4a;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="select-wrapper">
        <select id="actions">
          <option value="explanation">Explain the Question</option>
          <option value="approach">Approach to Solve</option>
          <option value="review">Review my Code</option>
        </select>
        </div>
        <button id="generate_summary">Generate</button>
      </div>
      <div id="explanation_viewer" class="explanation-box">
        Hi there! How can I assist you today?
      </div>
    </div>

    <script src="text-parser.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
