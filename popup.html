<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        width: 500px;
        background: #18181b;
        font-family: Arial, sans-serif;
        color: #f3f4f6;
        display: flex !important;
      }
      .container {
        max-width: 400px;
        height: auto;
        background: #23232a;
        border-radius: 16px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.16);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        gap: 16px;
        margin: 40px auto;
      }

      .row {
        display: flex;
        gap: 12px;
      }
      select {
        flex: 1;
        padding: 8px 12px;
        border: 1px solid #27272a;
        border-radius: 8px;
        background: #18181b;
        color: #f3f4f6;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        outline: none;
        transition: box-shadow 0.2s, border-color 0.2s;
      }
      select:focus {
        border-color: #6366f1;
        box-shadow: 0 0 0 2px #6366f1;
      }
      button {
        background: #6366f1;
        color: #fff;
        font-weight: 600;
        padding: 8px 16px;
        border: none;
        border-radius: 8px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        cursor: pointer;
        transition: background 0.2s;
      }
      button:hover {
        background: #4f46e5;
      }

      .example-block img {
        max-width: 100%;
        height: auto;
        border-radius: 8px;
        aspect-ratio: 16 / 9;
      }

      .explanation-box {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        width: 400px;
        overflow: hidden;
        scrollbar-width: 0;
        background-color: #1f1f1f;
        color: #f0f0f0;
        padding: 1rem;
        border-radius: 12px;
        font-family: "Segoe UI", sans-serif;
        font-size: 0.875rem;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        line-height: 1.6;
        max-width: 100%;
        background: #27272a;
        border-radius: 8px;
        padding: 12px;
        margin-top: 8px;
        font-family: inherit;
      }

      .explanation-box ul {
        padding-left: 1.2rem;
        list-style-type: disc;
        margin-bottom: 1rem;
      }

      .explanation-box li {
        margin-bottom: 0.75rem;
      }

      .explanation-box p {
        margin: 0.25rem 0;
      }

      .explanation-box strong {
        color: #ffffff;
        font-weight: 600;
      }

      .explanation-box pre code {
        display: block;
        max-width: 100%;
        overflow: scroll;
        background-color: #2d2d2d;
        max-height: 200px;
        color: #90ee90;
        padding: 0.2rem 0.4rem;
        border-radius: 4px;
        font-size: 1rem;
      }

      .explanation-box code::-webkit-scrollbar {
        display: none; 
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="row">
        <select id="actions">
          <option value="explanation">Explain the Question</option>
          <option value="approach">Approach to Solve</option>
          <option value="review">Review my Code</option>
        </select>
        <button id="generate_summary">Generate</button>
      </div>
      <div id="explanation_viewer" class="explanation-box">
        Hi there! How can I assist you today?
      </div>
    </div>

    <script src="text-parser.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
